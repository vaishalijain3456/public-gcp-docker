server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Day 10 -- our app has pages like /crud that are not real files.
    # If a request doesn't match a real file, send index.html instead, so
    # the page still loads correctly (even after a refresh).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
